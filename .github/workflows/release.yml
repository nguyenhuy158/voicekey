name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # build.sh stamps the app with git describe

      - name: Build
        env:
          # v1.2.3 -> 1.2.3, so the tag is what About says.
          VOICEKEY_VERSION: ${{ github.ref_name }}
        run: |
          export VOICEKEY_VERSION="${VOICEKEY_VERSION#v}"
          ./build.sh

      - name: Self-test
        run: ./VoiceKey.app/Contents/MacOS/VoiceKey --selftest

      - name: Package
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # ditto keeps the bundle's symlinks and resource forks; zip -r does not.
          ditto -c -k --keepParent VoiceKey.app "VoiceKey-$TAG.zip"
          shasum -a 256 "VoiceKey-$TAG.zip" > checksums.txt

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > notes.md <<EOF
          ## Install

          1. Download \`VoiceKey-$TAG.zip\`, unzip, drag **VoiceKey.app** to \`/Applications\`.
          2. The build is ad-hoc signed, so Gatekeeper quarantines it. Clear that once:

                 xattr -dr com.apple.quarantine /Applications/VoiceKey.app

          3. Launch it, then grant **Microphone** and **Accessibility** in
             System Settings → Privacy & Security, and relaunch.
          4. Open **Settings → Setup** and hit **Install Engine & Model**. It installs
             whisper-cpp through Homebrew and downloads the model for you.

          Check the setup any time with:

                 /Applications/VoiceKey.app/Contents/MacOS/VoiceKey --checkperms

          ## How to use

          VoiceKey lives in the menu bar (mic icon), there is no dock window.

          - **Hold right ⌘, speak, release** — the text is typed into whatever app is
            focused. Hold **right ⌥** for the second language (Vietnamese by default).
          - **Double-tap** a talk key to latch recording on; tap again to stop, so you
            don't have to hold it through a long paragraph.
          - **Escape** while recording throws the clip away.
          - **⌃⌘V** pastes the previous transcript again.
          - The icon is the state: mic (idle) → waveform (recording) → hourglass (working).

          Worth turning on in **Settings**:

          - **Select to Edit** — highlight text, hold the key and say the change
            ("make this shorter") to rewrite it in place.
          - **Streaming Mode** — types each sentence as you pause instead of all of it
            on release.
          - **Deep Context** — feeds the text around your cursor to whisper so names and
            jargon come out right.
          - **Privacy Mode** — keeps audio, transcripts and cloud cleanup off entirely.

          Both talk keys, the languages and every shortcut are rebindable in Settings.

          ## Checksums

          \`\`\`
          $(cat checksums.txt)
          \`\`\`
          EOF
          gh release create "$TAG" \
            "VoiceKey-$TAG.zip" checksums.txt \
            --title "VoiceKey $TAG" \
            --notes-file notes.md \
            --generate-notes
