name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: ./build.sh
      - name: Self-test
        run: ./VoiceKey.app/Contents/MacOS/VoiceKey --selftest
      - name: Coverage
        run: ./cov.sh
